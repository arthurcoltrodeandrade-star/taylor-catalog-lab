[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taylor-catalog-lab"
version = "0.1.0"
description = "Music catalog engineering: radix search, audio-feature analytics and SQLite"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.6", "uvicorn==0.34.0", "httpx==0.28.1", "pydantic==2.10.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.package-data]
taylor_lab = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
